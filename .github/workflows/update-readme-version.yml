# Automatically update the Maven dependency version in README.md when a new
# release tag is pushed.
# See https://github.com/FasterXML/jackson-core/issues/1586

name: Update README version

on:
  push:
    tags:
      - "jackson-core-3.*"
      - "!*-rc*"
      - "!*.pr*"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 3.x
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#jackson-core-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Update README.md
        run: |
          # Update the 3.x version in the Maven dependency snippet
          sed -i -E \
            '/Jackson 3\.x/,/<\/dependency>/ s|<version>[0-9]+\.[0-9]+\.[0-9]+[^<]*</version>|<version>${{ steps.version.outputs.version }}</version>|' \
            README.md
      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && exit 0
          BRANCH="update-readme-version-${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "Update README.md Maven version to ${{ steps.version.outputs.version }}"
          git push -u origin "$BRANCH"
          gh pr create --base 3.x --head "$BRANCH" \
            --title "Update README.md Maven version to ${{ steps.version.outputs.version }}" \
            --body "Automated PR to update the Maven dependency version in README.md after release of ${{ steps.version.outputs.version }}.

          See #1586"
